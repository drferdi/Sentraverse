# Capsule standalone: workspace pnpm milik sentraverse sendiri, lockfile di folder ini.
packages: []

# Kontrak standalone menolak symlink di pohon capsule; linker hoisted membuat
# node_modules datar tanpa symlink.
nodeLinker: hoisted

allowBuilds:
  sharp: true
  unrs-resolver: true

# Advisori keamanan: transitive pins via next/postcss/tailwind (pnpm audit).
# braces (dev-only via eslint-config-next) has no published patch >=3.0.4 yet.
overrides:
  postcss: ">=8.5.23"
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"
